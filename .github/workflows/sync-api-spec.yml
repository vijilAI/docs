name: Sync API spec from vijil-console

on:
  schedule:
    - cron: "0 13 * * 1-5" # weekdays, 13:00 UTC
  workflow_dispatch:

# GH_PAT (repo secret) is used only to read vijil-console, which is internal.
# Writes to this repo use the built-in GITHUB_TOKEN, which needs
# Settings > Actions > "Allow GitHub Actions to create and approve pull requests".
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-api-spec
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out vijil-console specs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vijilAI/vijil-console
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: .console
          sparse-checkout: specs
          persist-credentials: false

      - name: Merge specs into openapi/api.json
        id: merge
        run: |
          set -euo pipefail
          git show HEAD:openapi/api.json > "$RUNNER_TEMP/before.json"
          python3 scripts/merge_openapi.py .console/specs --output openapi/api.json
          echo "console_sha=$(git -C .console rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          rm -rf .console
          python3 - "$RUNNER_TEMP/before.json" openapi/api.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          old, new = (set(json.load(open(f))["paths"]) for f in sys.argv[1:3])
          print(f"### API spec sync\n\nPaths: {len(old)} -> {len(new)} "
                f"(+{len(new - old)} added, -{len(old - new)} removed)\n")
          for label, items in (("Added", new - old), ("Removed", old - new)):
              if items:
                  print(f"<details><summary>{label} ({len(items)})</summary>\n")
                  print("\n".join(f"- `{p}`" for p in sorted(items)))
                  print("\n</details>\n")
          PY

      - name: Open or update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/sync-api-spec-from-console
          delete-branch: true
          add-paths: openapi/api.json
          commit-message: "docs: Sync API spec from vijil-console@${{ steps.merge.outputs.console_sha }}"
          title: "docs: Sync API spec from vijil-console"
          body: |
            Automated update of `openapi/api.json` from [`vijil-console/specs`](https://github.com/vijilAI/vijil-console/tree/main/specs) at `${{ steps.merge.outputs.console_sha }}`.

            Generated by `.github/workflows/sync-api-spec.yml` using `scripts/merge_openapi.py`.

            Before merging:
            - [ ] Check new endpoints are meant to be public
            - [ ] Check removed endpoints are not still linked from guide pages
          labels: api-spec
          reviewers: lukiccd
